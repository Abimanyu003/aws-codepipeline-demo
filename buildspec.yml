version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11

    commands:
      - echo Installing Terraform
      - wget https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip
      - unzip terraform_1.7.5_linux_amd64.zip
      - mv terraform /usr/local/bin/

  build:
    commands:
      - terraform init
      - terraform validate
      - terraform plan
      - terraform apply -auto-approve

artifacts:
  files:
    - '**/*'